
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FFP — Family Football Pick'em Ledger</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0f14; --panel:#121825; --muted:#1e2433; --ink2:#e7ecf7; --sub:#a9b5cf;
    --eagles:#145a32; --eagles-2:#0b0b0b;
    --vikings:#4c1d95; --vikings-2:#b08900;
    --dad:#1e3a8a;             /* Blue override for Dad */
    --wife:#3b0764;            /* Purple override for Wife */
    --wife-2:#0f0f0f;          /* Black secondary */
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 20% -10%, #1a2336 0%, #0d1117 60%, #090c11 100%);color:var(--ink2);font-family:"Outfit",system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  a{color:#8b5cf6} a:hover{text-decoration:underline}
  .hero{position:relative;overflow:hidden;border-bottom:1px solid #1d2433;background:linear-gradient(180deg, rgba(20,34,40,.7), rgba(9,12,17,.9));}
  .hero-inner{max-width:1100px;margin:0 auto;padding:24px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .hero img.logo{height:72px;width:auto;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.35)}
  .hero h1{margin:0;font-weight:800;letter-spacing:.2px;line-height:1.1;font-size:28px}
  .hero .sub{color:var(--sub)}

  .marquee{position:relative;height:30px;overflow:hidden}
  .marquee .track{position:absolute;white-space:nowrap;animation:scroll 14s linear infinite}
  @keyframes scroll {from{transform:translateX(100%)} to{transform:translateX(-100%)}}

  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#0f1523;border:1px solid #222b42;color:#c6d2ee;font-size:12px}
  .field{max-width:1100px;margin:16px auto;padding:0 16px;display:grid;gap:16px}
  .panel{background:var(--panel);border:1px solid var(--muted);border-radius:18px;padding:16px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grow{flex:1 1 240px}
  label.lbl{font-size:12px;color:var(--sub);display:block;margin-bottom:6px}
  input[type="number"],input[type="text"],select{width:100%;padding:11px 12px;background:#0a0f19;border:1px solid #1e2740;border-radius:12px;color:var(--ink2)}
  input[type="checkbox"]{transform:scale(1.2);accent-color:#8b5cf6}
  button{background:#8b5cf6;border:none;color:white;padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer}
  button.secondary{background:#1e2740;color:#e7ecf7}
  button.ghost{background:transparent;border:1px solid #2a3558;color:#c3ccee}
  .right{margin-left:auto}

  .tag{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;border:1px solid #22304d;background:#0b0f1c;font-size:12px;color:#c9d4f0;white-space:nowrap}
  .dot{display:inline-block;width:10px;height:10px;border-radius:999px;background:#999}
  .name{font-weight:700}
  .t-eagles{border-color:var(--eagles); box-shadow:inset 0 0 0 1px var(--eagles-2)}
  .t-vikings{border-color:var(--vikings);box-shadow:inset 0 0 0 1px var(--vikings-2)}
  .t-dad{border-color:var(--dad);box-shadow:inset 0 0 0 1px var(--dad)}
  .t-wife{border-color:var(--wife);box-shadow:inset 0 0 0 1px var(--wife-2)}

  .kpi{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
  .kpi .card{background:#0b0f1a;border:1px solid #1e2740;border-radius:16px;padding:12px 14px;min-width:160px}
  .kpi .label{font-size:12px;color:var(--sub)} .kpi .val{font-size:22px;font-weight:900}
  .ok{color:#22c55e} .warn{color:#f59e0b} .bad{color:#ef4444}

  .table{width:100%;border-collapse:separate;border-spacing:0 8px;margin-top:8px}
  .table th{text-align:left;font-size:12px;color:var(--sub);padding:0 8px}
  .table td{background:#0b0f1a;border:1px solid #1e2740;padding:10px 12px;border-radius:12px}
  .week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const STORAGE_KEY = 'ffp-ledger-v3';

const TEAMS = {
  eagles: { name:'Eagles', cls:'t-eagles', icon:'🦅' },
  vikings:{ name:'Vikings', cls:'t-vikings', icon:'🟣' }
};

const DEFAULT_MEMBERS = [
  { id:'ducky1982',  display:'Ducky1982',  name:'Arica',    buyin:10, team:'vikings',  tagClass:'t-vikings' },
  { id:'patriciaharris65', display:'Patriciaharris65', name:'Patricia', buyin:10, team:'vikings', tagClass:'t-vikings' },
  { id:'purplegang56', display:'Purplegang56', name:'Dad',      buyin:10, team:'vikings', tagClass:'t-dad' },       // blue override
  { id:'purplesparkle15', display:'Purplesparkle15', name:'Wife',     buyin:10, team:'eagles', tagClass:'t-wife' },  // purple/black override
  { id:'thepurplecrazygirl24', display:'ThepurpleCrazygirl24', name:'Daughter', buyin:10, team:'eagles', tagClass:'t-eagles' },
  { id:'th3commish',   display:'Th3C0mmish',   name:'You',      buyin:10, team:'eagles', tagClass:'t-eagles' },
];

const state = {
  meta:{ weeks:18, buyin:10, currentWeek:1, notes:'' },
  members:[...DEFAULT_MEMBERS],
  weeks:{}
};

function isEdit(){ return location.hash.includes('edit') || window.__edit === true; }
function dollars(n){ return '$'+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:0}); }
function load(){ try{ const raw=localStorage.getItem(STORAGE_KEY); if(raw) Object.assign(state, JSON.parse(raw)); }catch(e){} }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); renderAll(); }
function ensureWeek(n){ const k=String(n); if(!state.weeks[k]) state.weeks[k]={paid:[], winners:[], payout:0}; return state.weeks[k]; }

function tagHTML(m){
  const t = TEAMS[m.team] || {name:'Neutral', icon:'🏈'};
  const cls = m.tagClass || (t.cls || '');
  return `<span class="tag ${cls}"><span>${t.icon}</span> <span class="name"># ${m.display}</span></span>`;
}

function renderMeta(){
  $('#weeks').value = state.meta.weeks;
  $('#buyin').value = state.meta.buyin;
  $('#currentWeek').value = state.meta.currentWeek;
  $('#notes').value = state.meta.notes;
}

function renderMembers(){
  const box=$('#members'); box.innerHTML='';
  state.members.forEach(m=>{
    const row=document.createElement('div');
    row.className='row';
    row.innerHTML = `
      ${tagHTML(m)}
      <input ${isEdit()? '' : 'disabled'} data-id="${m.id}" class="nm grow" type="text" value="${m.name}"/>
      <select ${isEdit()? '' : 'disabled'} data-id="${m.id}" class="tm">
        <option value="eagles" ${m.team==='eagles'?'selected':''}>Eagles</option>
        <option value="vikings" ${m.team==='vikings'?'selected':''}>Vikings</option>
      </select>
      <input ${isEdit()? '' : 'disabled'} data-id="${m.id}" class="bi" type="number" min="0" step="1" value="${m.buyin}"/>
      <button ${isEdit()? '' : 'disabled'} class="ghost rm" data-id="${m.id}">Remove</button>
    `;
    box.appendChild(row);
  });
  const add=$('#addMemberRow');
  add.innerHTML = isEdit()? `
    <div class="row">
      <input id="newDisp" class="grow" type="text" placeholder="Display (unique id)"/>
      <input id="newName" class="grow" type="text" placeholder="Name/Nickname"/>
      <select id="newTeam"><option value="eagles">Eagles</option><option value="vikings">Vikings</option></select>
      <input id="newBI" type="number" min="0" step="1" value="${state.meta.buyin}"/>
      <button id="addMember">Add Member</button>
    </div>` : `<div class="pill">🔒 Editing locked — add #edit to URL</div>`;

  box.querySelectorAll('.nm').forEach(inp=> inp.onchange=()=>{ const m=state.members.find(x=>x.id===inp.dataset.id); m.name=inp.value.trim(); save(); });
  box.querySelectorAll('.tm').forEach(sel=> sel.onchange=()=>{ const m=state.members.find(x=>x.id===sel.dataset.id); m.team=sel.value; m.tagClass = sel.value==='eagles'?'t-eagles':'t-vikings'; save(); });
  box.querySelectorAll('.bi').forEach(inp=> inp.onchange=()=>{ const m=state.members.find(x=>x.id===inp.dataset.id); m.buyin=Number(inp.value)||0; save(); });
  box.querySelectorAll('.rm').forEach(btn=> btn.onclick=()=>{ const id=btn.dataset.id; state.members=state.members.filter(x=>x.id!==id); for(const k in state.weeks){ state.weeks[k].paid=state.weeks[k].paid.filter(x=>x!==id); state.weeks[k].winners=state.weeks[k].winners.filter(w=>w.id!==id); } save(); });

  if(isEdit()) $('#addMember').onclick = ()=>{
    const d=$('#newDisp').value.trim(); if(!d) return alert('Display is required');
    const id=d.toLowerCase().replace(/[^a-z0-9]+/g,'');
    if(state.members.some(m=>m.id===id)) return alert('ID exists');
    const team=$('#newTeam').value;
    state.members.push({ id, display:d, name:($('#newName').value||d), team, tagClass: team==='eagles'?'t-eagles':'t-vikings', buyin:Number($('#newBI').value)||0 });
    save();
  };
}

function renderPaidWinners(){
  const paid=$('#paidList'); paid.innerHTML='';
  const win=$('#winnersList'); win.innerHTML='';
  state.members.forEach(m=>{
    const lab=document.createElement('label');
    lab.className='tag '+(m.tagClass||''); lab.style.cursor='pointer';
    lab.innerHTML = `<input ${isEdit()? '' : 'disabled'} type="checkbox" data-id="${m.id}"> ${m.display}`;
    paid.appendChild(lab);

    const row=document.createElement('div'); row.className='row';
    row.innerHTML = `${tagHTML(m)} <input ${isEdit()? '' : 'disabled'} type="number" min="0" step="1" class="winAmt grow" data-id="${m.id}" placeholder="Amount for ${m.display}"/>`;
    win.appendChild(row);
  });
}

function computeSummary(){
  const paidBy={}, winBy={};
  state.members.forEach(m=>{ paidBy[m.id]=0; winBy[m.id]=0; });
  let received=0,payout=0,unpaid=0;
  for(const wk in state.weeks){
    const w=state.weeks[wk];
    w.paid.forEach(id=>{ const mb=state.members.find(x=>x.id===id); const amt=mb?(mb.buyin||state.meta.buyin):state.meta.buyin; paidBy[id]+=amt; received+=amt; });
    w.winners.forEach(win=>{ winBy[win.id]+=Number(win.amount)||0; payout+=Number(win.amount)||0; });
    unpaid += Math.max(0,(state.members.length*state.meta.buyin)-(w.paid.length*state.meta.buyin));
  }
  return {paidBy,winBy,received,payout,unpaid,bank:received-payout};
}

function renderSummary(){
  const {paidBy,winBy,received,payout,unpaid,bank} = computeSummary();
  const k=$('#kpis'); k.innerHTML='';
  [['Received',received,'ok'],['Payouts',payout,'warn'],['Bank',bank, bank>=0?'ok':'bad'],['Unpaid (expected)',unpaid,'bad']].forEach(([l,v,c])=>{
    const d=document.createElement('div'); d.className='card'; d.innerHTML=`<div class="label">${l}</div><div class="val ${c}">${dollars(v)}</div>`; k.appendChild(d);
  });
  const tb=$('#summaryTable tbody'); tb.innerHTML='';
  state.members.forEach(m=>{
    const t=TEAMS[m.team]||{name:'Neutral'};
    const paid=paidBy[m.id]||0, won=winBy[m.id]||0, net=won-paid;
    const tr=document.createElement('tr');
    tr.innerHTML = `<td>${tagHTML(m)} <span class="sub">(${m.name})</span></td>
      <td>${t.name}</td><td>${dollars(paid)}</td><td class="${won>0?'ok':''}">${dollars(won)}</td><td class="${net>=0?'ok':'bad'}">${dollars(net)}</td>`;
    tb.appendChild(tr);
  });
}

function renderWeekCards(){
  const box=$('#weekCards'); box.innerHTML='';
  for(let i=1;i<=state.meta.weeks;i++){
    const w=state.weeks[String(i)]||{paid:[],winners:[],payout:0};
    const card=document.createElement('div'); card.className='panel';
    const paidTags = w.paid.map(id=>{const m=state.members.find(x=>x.id===id); return tagHTML(m||{display:id, team:'eagles'});}).join(' ');
    const winTags  = w.winners.map(win=>{const m=state.members.find(x=>x.id===win.id); return `${tagHTML(m||{display:win.id, team:'eagles'})} <span class="pill">${dollars(win.amount)}</span>`;}).join(' ');
    card.innerHTML = `<div class="row"><span class="pill">Week ${i}</span><div class="right sub">Payout: <b>${dollars(w.payout||0)}</b></div></div>
      <div style="margin-top:8px"><div class="sub">Paid</div><div>${paidTags || '<span class="sub">—</span>'}</div></div>
      <div style="margin-top:8px"><div class="sub">Winners</div><div>${winTags || '<span class="sub">—</span>'}</div></div>
      <div class="row" style="margin-top:8px">
        <button class="ghost" data-week="${i}" ${isEdit()?'':'disabled'}>Edit</button>
        <button class="ghost" data-clear="${i}" ${isEdit()?'':'disabled'}>Reset</button>
      </div>`;
    box.appendChild(card);
  }
  $$('#weekCards [data-week]').forEach(b=> b.onclick=()=>{ const w=Number(b.dataset.week); $('#wk').value=w; loadWeekToForm(w); window.scrollTo({top:0,behavior:'smooth'}); });
  $$('#weekCards [data-clear]').forEach(b=> b.onclick=()=>{ if(!confirm('Clear this week?')) return; delete state.weeks[String(b.dataset.clear)]; save(); });
}

function loadWeekToForm(weekNum){
  const w=ensureWeek(weekNum);
  $('#payout').value=w.payout||0;
  $$('#paidList input[type=checkbox]').forEach(cb=>cb.checked=false);
  $$('#winnersList .winAmt').forEach(inp=>inp.value='');
  w.paid.forEach(id=>{ const cb=$(`#paidList input[data-id="${id}"]`); if(cb) cb.checked=true; });
  w.winners.forEach(win=>{ const inp=$(`#winnersList .winAmt[data-id="${win.id}"]`); if(inp) inp.value=win.amount; });
}

function renderMarquee(){
  const cw=state.meta.currentWeek;
  const w=state.weeks[String(cw)];
  if(!w || !w.winners || w.winners.length===0){ $('#marquee').style.display='none'; return; }
  const text = w.winners.map(win=>{
    const m=state.members.find(x=>x.id===win.id);
    return (m?m.display:win.id) + ' ' + dollars(win.amount);
  }).join(' • ');
  $('#marqueeTrack').textContent = `WEEK ${cw} WINNER — ${text} — FFP FAMILY FOOTBALL PICK'EM — `;
  $('#marquee').style.display='block';
}

function exportCSV(){
  const {paidBy,winBy,received,payout,unpaid,bank} = computeSummary();
  const rows = [['Member','Team','Paid','Winnings','Net']];
  state.members.forEach(m=>{
    const team = (TEAMS[m.team]||{name:'Neutral'}).name;
    const paid=paidBy[m.id]||0, won=winBy[m.id]||0, net=won-paid;
    rows.push([m.display, team, paid, won, net]);
  });
  rows.push([]);
  rows.push(['Totals','','Received',received,'Bank',bank,'Unpaid',unpaid]);
  const csv = rows.map(r=>r.map(x=>typeof x==='string' && x.includes(',') ? `"${x}"` : x).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='ffp-summary.csv'; a.click(); URL.revokeObjectURL(url);
}

function renderAll(){
  renderMeta(); renderMembers(); renderPaidWinners(); renderSummary(); renderWeekCards(); renderMarquee();
}

function init(){
  load(); renderAll();
  $('#weeks').onchange=e=>{ state.meta.weeks=Math.max(1,Number(e.target.value)||18); save(); };
  $('#buyin').onchange=e=>{ state.meta.buyin=Math.max(0,Number(e.target.value)||10); save(); };
  $('#currentWeek').onchange=e=>{ state.meta.currentWeek=Math.max(1,Number(e.target.value)||1); save(); renderMarquee(); };
  $('#notes').onchange=e=>{ state.meta.notes=e.target.value; save(); };
  $('#toggleEdit').onclick=()=>{ if(isEdit()){ location.hash=''; window.__edit=false; } else { location.hash='#edit'; window.__edit=true; } renderAll(); };
  $('#copyLink').onclick=()=>{ navigator.clipboard.writeText(location.origin+location.pathname); alert('Viewer link copied'); };
  $('#csvBtn').onclick=exportCSV;

  $('#saveWeek').onclick=()=>{
    if(!isEdit()) return alert('Unlock edit mode (add #edit)');
    const week=Math.max(1,Number($('#wk').value)||1);
    const w=ensureWeek(week);
    w.paid = $$('#paidList input[type=checkbox]:checked').map(cb=>cb.dataset.id);
    // winners
    const entries = $$('#winnersList .winAmt');
    const specified = entries.filter(inp => Number(inp.value) > 0).map(inp => ({id:inp.dataset.id, amount:Number(inp.value)||0}));
    const checkedWinners = entries.filter(inp => (inp.value==='' || Number(inp.value)===0) && w.paid.includes(inp.dataset.id)).map(inp => inp.dataset.id);
    let winners = specified;
    const auto = $('#autoSplit').checked;
    const manualTotal = Number($('#payout').value) || 0;
    if(auto){
      const toSplit = manualTotal>0 ? manualTotal - specified.reduce((a,b)=>a+b.amount,0) : (state.meta.buyin * w.paid.length) - specified.reduce((a,b)=>a+b.amount,0);
      const pool = Math.max(0,toSplit);
      if(checkedWinners.length>0 && pool>0){
        const each = Math.floor((pool/checkedWinners.length)*100)/100;
        winners = winners.concat(checkedWinners.map(id=>({id, amount:each})));
      }
    }
    w.winners = winners;
    // payout total
    const sum=w.winners.reduce((a,b)=>a+(Number(b.amount)||0),0);
    w.payout = manualTotal>0? manualTotal : sum;
    state.meta.currentWeek=week;
    save();
    loadWeekToForm(week);
    renderMarquee();
  };
  $('#clearWeek').onclick=()=>{ $$('#paidList input[type=checkbox]').forEach(cb=>cb.checked=false); $$('#winnersList .winAmt').forEach(inp=>inp.value=''); $('#payout').value=0; };
  $('#exportBtn').onclick=()=>{ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='ffp-ledger.json'; a.click(); URL.revokeObjectURL(url); };
  $('#importFile').onchange=(e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=(ev)=>{ try{ Object.assign(state, JSON.parse(ev.target.result)); save(); }catch(err){ alert('Invalid JSON'); } }; r.readAsText(f); };
  loadWeekToForm(state.meta.currentWeek);
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
